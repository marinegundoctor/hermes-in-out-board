version: '3.8'

services:
  api:
    build: .
    container_name: hermes_api
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - DB_PATH=/app/data/inout.db
      - TZ=America/New_York
    restart: unless-stopped
    
  bot:
    build: .
    container_name: hermes_bot
    command: python telegram_bot.py
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - DB_PATH=/app/data/inout.db
      - TZ=America/New_York
    restart: unless-stopped
    depends_on:
      - api
